<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concurso de Pura Raza Árabe · Zafra</title>
<meta name="description" content="Resultados en directo del Concurso de Pura Raza Árabe de Zafra, Badajoz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-row">
    <a href="#/" class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34"><path d="M24 2 C10 2 2 14 2 26 L2 46 L46 46 L46 26 C46 14 38 2 24 2 Z" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
      </span>
      <span class="brand-text">
        <strong>Pura Raza Árabe</strong>
        <em>Zafra · Badajoz</em>
      </span>
    </a>
    <nav class="header-nav">
      <span id="admin-status" class="admin-status" hidden></span>
      <button id="btn-admin" class="btn-ghost">Acceso organización</button>
    </nav>
  </div>
</header>

<nav class="quicknav" hidden>
  <div class="wrap quicknav-row">
    <a href="#anuncios" class="quicknav-btn">Anuncios</a>
    <a href="#clases" class="quicknav-btn">Clases</a>
    <a href="#campeonatos" class="quicknav-btn">Campeonatos</a>
    <a href="#trofeos" class="quicknav-btn">Trofeos</a>
    <a href="#sorteo" class="quicknav-btn">Sorteo</a>
  </div>
</nav>

<main id="app" class="wrap"></main>

<footer class="site-footer">
  <div class="wrap footer-row">
    <p>Concurso de Pura Raza Árabe · Zafra, Badajoz</p>
    <p class="muted">Resultados actualizados en directo por la organización</p>
  </div>
</footer>

<!-- Modal de acceso -->
<dialog id="login-dialog" class="dialog">
  <form id="login-form" class="dialog-inner">
    <h2>Acceso organización</h2>
    <p class="muted small">Solo la organización puede editar clasificaciones y datos del concurso.</p>
    <label>Correo
      <input type="email" name="email" required autocomplete="username">
    </label>
    <label>Contraseña
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <p id="login-error" class="error" hidden></p>
    <div class="dialog-actions">
      <button type="button" id="btn-cancel-login" class="btn-ghost">Cancelar</button>
      <button type="submit" class="btn-primary">Entrar</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data-demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
